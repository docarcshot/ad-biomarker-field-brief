name: Validate, build, and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_through:
        description: Successful review date (YYYY-MM-DD); leave blank to build only
        required: false
      qualified:
        description: Number of qualified entries (0–3)
        required: false
        default: "0"
      failure_message:
        description: Record failure without advancing the review date
        required: false
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ad-biomarker-field-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record manual review outcome
        if: github.event_name == 'workflow_dispatch' && (inputs.reviewed_through != '' || inputs.failure_message != '')
        shell: bash
        run: |
          if [ -n "${{ inputs.failure_message }}" ]; then
            node scripts/review.mjs --reviewed-through="${{ inputs.reviewed_through }}" --qualified="${{ inputs.qualified }}" --failure="${{ inputs.failure_message }}" || true
          else
            node scripts/review.mjs --reviewed-through="${{ inputs.reviewed_through }}" --qualified="${{ inputs.qualified }}"
          fi
      - name: Check scheduled freshness
        if: github.event_name == 'schedule'
        run: node scripts/check-freshness.mjs
      - name: Commit manual review outcome
        if: github.event_name == 'workflow_dispatch' && (inputs.reviewed_through != '' || inputs.failure_message != '')
        shell: bash
        run: |
          git config user.name "ad-biomarker-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/status.json
          git diff --cached --quiet || git commit -m "Record biomarker review outcome"
          git push
      - run: node scripts/validate.mjs
      - run: node scripts/build.mjs
      - run: node scripts/test-build.mjs
      - run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v5
